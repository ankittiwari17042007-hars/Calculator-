<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Calculator App</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="calculator">

        <div class="display">
            <div id="previous"></div>
            <div id="current">0</div>
        </div>

        <div class="buttons">

            <button class="span-two" onclick="clearDisplay()">AC</button>
            <button onclick="deleteNumber()">⌫</button>
            <button class="operator" onclick="chooseOperation('%')">%</button>

            <button onclick="appendNumber('7')">7</button>
            <button onclick="appendNumber('8')">8</button>
            <button onclick="appendNumber('9')">9</button>
            <button class="operator" onclick="chooseOperation('÷')">÷</button>

            <button onclick="appendNumber('4')">4</button>
            <button onclick="appendNumber('5')">5</button>
            <button onclick="appendNumber('6')">6</button>
            <button class="operator" onclick="chooseOperation('×')">×</button>

            <button onclick="appendNumber('1')">1</button>
            <button onclick="appendNumber('2')">2</button>
            <button onclick="appendNumber('3')">3</button>
            <button class="operator" onclick="chooseOperation('-')">−</button>

            <button onclick="appendNumber('0')">0</button>
            <button onclick="appendNumber('.')">.</button>
            <button class="equal" onclick="compute()">=</button>
            <button class="operator" onclick="chooseOperation('+')">+</button>

        </div>
        <button class="theme-button" onclick="toggleTheme()">
    🌙 Dark Mode
        </button>

        <button class="history-button" onclick="toggleHistory()">
    📜 History
</button>

<div class="history" id="history-panel">
    <h3>Calculation History</h3>
    <div id="history-list"></div>
    
<button class="clear-history" onclick="clearHistory()">
    🗑️ Clear History
</button>
    </div>

    <script src="script.js"></script>

</body>
</html>
